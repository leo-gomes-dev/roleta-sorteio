<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roleta do Destino | Leo Gomes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h3 class="titulo">🎯 ROLETA DO DESTINO</h3>
      <p class="subtitulo">Fullstack Developer Edition 🚀</p>

      <div class="caixa-roleta">
        <!-- Ponteiro Indicador do Topo -->
        <div class="ponteiro">▼</div>

        <!-- Corpo da Roleta HTML Puro -->
        <div id="roleta-circulo" class="circulo">
          <!-- As fatias e textos serão injetados aqui -->
        </div>
      </div>

      <button id="botao-girar" class="botao">🎲 GIRAR ROLETA</button>

      <div id="painel-resultado" class="painel-resultado" style="display: none">
        <small>Efeito Ativo para o Aluno/Equipe:</small>
        <p id="texto-resultado" class="texto-resultado"></p>
      </div>

      <!-- Rodapé Limpo e Minimalista -->
      <footer class="rodape">
        <p class="direitos">© 2026 Leo Gomes.</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
